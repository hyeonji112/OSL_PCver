<!DOCTYPE html>
    <html lang="ko">
    <head>
    <meta charset="UTF-8">
    <title>OSL 2026</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="web-frame">

<div class="container">

<!-- icons -->
    <img src="./img/icon2.png" class="icon icon2">
    <img src="./img/icon4.png" class="icon icon4">
    <img src="./img/icon1.png" class="icon icon1">

<!-- typo -->
    <img src="./img/typo.png" class="typo">

<!-- message -->
    <img src="./img/message.png" class="message" id="message">


<div class="emoji-panel">
  <span class="emoji">❤️</span>
  <span class="emoji">🥹</span>
  <span class="emoji">👍</span>
  <span class="emoji">💥</span>
  <span class="emoji">💗</span>
  <span class="emoji">✨</span>
</div>


<!-- chat -->
    <div class="chat">

        <div class="chat-header">
        &lt; Message
        </div>

        <div id="chatBox" class="chat-box"></div>


        <div class="chat-input-area">
        <input id="chatInput" placeholder="오소랩을 위한 응원의 한마디..." />
        <button id="sendBtn">↑</button>
    </div>
    </div>
    </div>
    </div>


<!-- popup -->
<div id="popup" class="popup">

<div class="popup-content">

<div class="popup-header">

<div class="window-buttons">
<span class="btn red"></span>
<span class="btn yellow"></span>
<span class="btn green"></span>
</div>

<div class="window-title">Search</div>

</div>

<span class="close">&times;</span>

<div class="popup-body">
<p>팝업 내용</p>
</div>

</div>
</div>

<script src="script.js"></script>

</body>
</html>
